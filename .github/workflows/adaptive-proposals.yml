name: Adaptive face proposal tests

on:
  pull_request:
    paths:
      - 'scripts/adaptive_faces/**'
      - '.github/workflows/adaptive-proposals.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/adaptive_faces/**'
      - '.github/workflows/adaptive-proposals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/adaptive_faces/requirements.txt
      - run: python -m unittest discover -s scripts/adaptive_faces -p 'test_*.py' -v
